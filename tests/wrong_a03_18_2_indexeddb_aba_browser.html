<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A18-2 격리 ABA 경합</title><style>body{font:16px system-ui;margin:16px;max-width:650px}button{padding:12px;margin:5px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #aaa;padding:12px} .warn{color:#9b3300;font-weight:bold}</style><h1>읽기 전용 검토 경합 실증</h1><p>실제 오답 데이터가 아닌 고립된 테스트 IndexedDB만 사용합니다.</p><button id="run">A→B→A 주입 후 두 읽기 비교</button><pre id="out" aria-live="polite">대기</pre><script>
const dbName='wrong-a18-2-isolated-'+location.pathname.replace(/\W/g,'_');
const out=document.querySelector('#out');
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>r.result.createObjectStore('fixture');r.onerror=()=>reject(r.error);r.onsuccess=()=>resolve(r.result)})}
function tx(db,mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction('fixture',mode),s=t.objectStore('fixture');let result;fn(s,x=>result=x);t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
const get=(db)=>tx(db,'readonly',(s,done)=>{const r=s.get('record');r.onsuccess=()=>done(r.result)});
const put=(db,value)=>tx(db,'readwrite',(s)=>s.put(value,'record'));
document.querySelector('#run').onclick=async()=>{let db;try{db=await openDb();await put(db,{content:'A',revision:1});const first=await get(db);await put(db,{content:'B',revision:2});await put(db,{content:'A',revision:3});const second=await get(db);const sameContent=first.content===second.content;const changedRevision=first.revision!==second.revision;const pass=sameContent&&changedRevision&&second.revision===3;out.textContent=JSON.stringify({scenario:'A→B→A between separate read transactions',first,second,sameContent,changedRevision,isolatedDatabase:dbName,result:pass?'PASS: ABA content-only comparison misses write':'FAIL'},null,2);out.className=pass?'warn':'';}catch(e){out.textContent='FAIL: '+e.message}finally{db?.close()}};</script></html>
