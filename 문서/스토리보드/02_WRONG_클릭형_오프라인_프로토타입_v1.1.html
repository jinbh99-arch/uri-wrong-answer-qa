function screen(){

case 'W04':return `<div class="card mint" style="text-align:center;padding:22px 16px"><div style="font-size:54px">${state.recordSaved?'✅':'🕓'}</div><h2 style="font-size:22px;margin:7px 0">${state.recordSaved?'가상 오답이 저장됐어요':'저장 확인이 필요해요'}</h2><p class="muted">${state.photoOnly?'사진만 먼저 기록했어요. 부모가 내용을 검토한 뒤 아이에게 보여 주세요.':'검토된 문제를 가상 목록에 반영했습니다.'}</p>${badge('현재 브라우저 메모리만 사용','amber')}</div><div class="card"><div class="row"><strong>${qtext()}</strong>${badge(state.photoOnly?'사진만 있음':'문제 등록됨',state.photoOnly?'amber':'green')}</div><p class="muted">수학 · 나눗셈 · 가상 등록 · 부모 확인 기록</p><div class="callout">실제 서버/브라우저 장기 저장 결과가 아닙니다. 새로고침하면 시연 상태가 초기화됩니다.</div></div><div class="buttons">${btn('오답 목록 보기','W05','primary')}${btn('다른 문제 등록','W02','ghost')}</div>`;
case 'W05':return `<div class="section"><h2>${state.role==='child'?'내가 다시 풀 문제':'모아둔 오답'}</h2>${badge('가상 데이터')}</div><div class="field"><label for="listFilter">오답 상태</label><select id="listFilter"><option ${state.filter==='전체'?'selected':''}>전체</option><option ${state.filter==='다시 풀기'?'selected':''}>다시 풀기</option><option ${state.filter==='사진만'?'selected':''}>사진만</option></select></div>${state.filter!=='사진만'?`<div class="tile"><span class="ico">🧮</span><div class="grow"><strong>${qtext()}</strong><p>수학 · 나눗셈 · 다시 풀기</p>${badge('재풀이 2회')}</div>${btn('풀기','W06','primary','tiny')}</div><div class="tile"><span class="ico">📖</span><div class="grow"><strong>지문에서 중요한 문장 찾기</strong><p>국어 · 읽기 · 가상 문제</p></div>${btn('확인','W06','ghost','tiny')}</div>`:''}${state.role==='parent' && state.filter!=='다시 풀기'?`<div class="tile"><span class="ico">📷</span><div class="grow"><strong>사진만 저장한 문제</strong><p>내용 검토 전 · 아이 목록에는 제외 권고</p></div>${btn('검토','W03','ghost','tiny')}</div>`:''}<div class="callout warning">이 목록은 UI 시연입니다. 실제 가족 인증을 거치지 않은 보기 전환은 개인정보 보호가 아닙니다.</div>${btn('새 오답 등록','W02','ghost','full')}`;
case 'W06':return `<div class="row"><span class="strong">나만의 다시 풀기</span>${badge('아이 화면','green')}</div><p class="muted">나눗셈 · 기본 개념 · 가상 예제</p><div class="progress"><span style="width:50%"></span></div><div class="question"><span class="eyebrow" style="color:#6976a1">문제 1 / 2</span><p class="muted">12개의 구슬을 3명에게 똑같이 나눠주면 한 명은 몇 개씩 받을까요?</p><div class="math-dots">${'<i></i>'.repeat(6)}</div><div class="math-dots">${'<i></i>'.repeat(6)}</div><div class="formula">12 ÷ 3 = ?</div></div>${[3,4,5,6].map((n,i)=>`<button class="option ${state.answer===n?'selected':''}" data-act="answer:${n}"><b>${i+1}</b>${n}개 ${state.answer===n?'✓':''}</button>`).join('')}<div class="callout">모르는 문제도 괜찮아요. 답을 고른 뒤 내가 어떻게 생각했는지 부모와 이야기할 수 있어요.</div>${btn('내 답 확인하기 →','submitanswer','primary','full')}`;
case 'W07':return `<div class="card mint" style="text-align:center"><div style="font-size:48px">${state.answer===4?'🌟':'🪄'}</div><h2 style="font-size:21px;margin:8px 0">${state.answer===4?'선택한 답이 예시 답과 같아요':'다시 생각해 볼 기회예요'}</h2><p class="muted">이 문항은 직접 만든 가상 예제입니다. 실제 사진 문제 전체의 자동 채점 기능을 뜻하지 않습니다.</p></div><div class="card"><div class="row"><span class="muted">내가 선택한 답</span><b>${state.answer===null?'선택 전':state.answer+'개'}</b></div><hr style="border:0;border-top:1px solid #e8ebf6;margin:12px 0"><div class="row"><span class="muted">가상 예제 정답</span><b>4개</b></div><div class="callout">12개를 세 명에게 똑같이 주면, 4개씩 세 묶음이 만들어집니다.</div></div>${btn('이 문제 다시 풀기','W06','ghost','full')}<div class="buttons">${btn('오답 목록','W05','ghost')}${btn('부모에게 보여주기','W08','primary')}</div><div class="callout warning">‘부모에게 보여주기’는 시안 내 가상 화면 이동입니다. 실제 보호자 본인확인은 미구현·미검증입니다.</div>`;
case 'W08':return `<div class="row"><span class="strong">오늘 아이의 풀이를 살펴봐요</span>${badge('부모 관찰','amber')}</div><div class="card"><strong>나눗셈 · 12 ÷ 3</strong><div class="mini-stat" style="margin-top:12px"><div><strong>${state.attempts}</strong><span>누적 재풀이</span></div><div><strong>2</strong><span>지난 관찰</span></div><div><strong>0</strong><span>미래 확인 완료</span></div></div><div class="callout">답 일치와 ‘이해했다’는 판단은 다릅니다. 부모가 실제 관찰한 사실만 기록해 주세요.</div></div><div class="card"><div class="field"><label for="observe">관찰한 내용 (가상)</label><textarea id="observe" maxlength="200">${escapeHTML(state.observation)}</textarea></div><div class="field"><label for="confidence">다음에 도움이 필요한 정도</label><select id="confidence"><option ${state.confidence==='조금 도움 필요'?'selected':''}>조금 도움 필요</option><option ${state.confidence==='혼자 설명 가능'?'selected':''}>혼자 설명 가능</option><option ${state.confidence==='다시 살펴보기'?'selected':''}>다시 살펴보기</option></select></div>${btn('관찰 저장하고 다음 확인','saveobserve','primary','full')}</div>`;
case 'W09':return `<div class="card tint"><span class="eyebrow" style="color:#4858ba">부모가 정하는 참고 일정</span><h2 style="font-size:20px;margin:7px 0">다음에는 아이에게<br>어떻게 물어볼까요?</h2><p class="muted">예: “12개를 3명에게 똑같이 나눌 때 왜 4개라고 생각했니?”</p></div><div class="card"><div class="field"><label for="reviewDate">확인 희망일</label><input id="reviewDate" type="date" value="${state.reviewDate}"></div><div class="row"><strong>확인 질문</strong>${badge(state.checkDone?'답변 확인':'아직 미확인',state.checkDone?'green':'amber')}</div><p class="small">날짜가 지났다고 자동으로 완료되지 않습니다. 알림 발송·자동 점수 산출도 보장되지 않습니다.</p><div class="checkbox"><input type="checkbox" id="checkDone" ${state.checkDone?'checked':''}><label for="checkDone">가상 재확인을 실제로 진행했다고 표시</label></div>${btn('계획 저장·복습 이력 보기','saveschedule','primary','full')}</div><div class="callout">복습 일정은 부모의 참고용입니다. 실제 학습 효과가 검증된 간격을 추천하지 않습니다.</div>`;
case 'W10':return `<div class="section"><h2>복습 이력</h2>${badge('가상 기록')}</div><div class="mini-stat"><div><strong>${state.attempts}</strong><span>재풀이 횟수</span></div><div><strong>2</strong><span>부모 관찰</span></div><div><strong>${state.checkDone?1:0}</strong><span>재확인 완료</span></div></div><div class="card"><h2 style="font-size:15px;margin:0">한 문제의 변화 기록</h2><div class="timeline">${state.events.map(e=>`<div class="event"><strong>${escapeHTML(e.date)} · ${escapeHTML(e.title)}</strong><p>${escapeHTML(e.desc)}</p></div>`).join('')}<div class="event"><strong>${escapeHTML(state.reviewDate.slice(5).replace('-', '/'))} 예정 · 재확인 질문</strong><p>${state.checkDone?'가상 확인 완료':'미래 확인 전 · 미확인 유지'}</p></div></div></div><div class="card warm"><strong>부모에게 드리는 안내</strong><p class="muted">정답 일치 횟수만으로 이해도나 성적 향상을 확정할 수 없어요. 아이가 설명하는 과정도 함께 살펴보세요.</p></div>${btn('부모 관찰 다시 쓰기','W08','ghost','full')}${btn('개인정보·백업 설정 보기','W11','primary','full')}`;
case 'W11':return `<div class="card error"><div class="row"><strong>개인정보 및 가족 접근</strong>${badge('미검증','red')}</div><p class="muted">실제 가족별 인증·소유권 분리, 사진 삭제, 기기 간 복원은 아직 서비스 수준에서 확인되지 않았어요.</p></div><div class="card"><h2 style="font-size:16px;margin:0 0 8px">내 기록 보호</h2><div class="tile"><span class="ico">🔐</span><div class="grow"><strong>가족별 본인확인</strong><p>실인증·403 서버 차단 미검증</p></div>${badge('대기','amber')}</div><div class="tile"><span class="ico">🗂️</span><div class="grow"><strong>암호화 백업·복원</strong><p>안전 복원 허용 전제 미충족</p></div>${badge('차단','red')}</div><div class="tile"><span class="ico">🧽</span><div class="grow"><strong>완전 삭제</strong><p>원본·백업 전체 삭제 미실증</p></div>${badge('대기','amber')}</div><button class="btn full" disabled>실제 백업 복원 (사용 불가)</button><button class="btn full" disabled style="margin-top:8px">가족 자료 완전 삭제 (사용 불가)</button></div><div class="callout warning">현재 코드 QA의 안전 복원 판단은 safeToRestore:false입니다. 시안에서 이를 우회하지 않습니다.</div>${btn('첫 화면으로','W01','primary','full')}`;
}
}
function render(){
let view=state.screen;if(!titles[view]){view='W01';state.screen=view;}
if(childOnly.has(view))state.role='child';else if(parentOnly.has(view))state.role='parent';
$('#roleName').textContent=state.role==='child'?'아이 보기 (가상)':'부모 보기 (가상)';
$('#screenTitle').textContent=titles[view];$('#screenId').textContent=view+' / 11';
$('#app').innerHTML=screen();
let isChild=state.role==='child';
$('#nav').innerHTML=(isChild?[['W05','📒','내 목록'],['W06','✏️','다시 풀기'],['W07','🌟','결과'],['W01','🏠','부모 홈']]:[['W01','🏠','홈'],['W05','📚','오답 목록'],['W08','💬','관찰'],['W11','⚙️','설정']]).map(([id,ico,label])=>`<button type="button" data-act="${id}" class="${view===id?'on':''}"><span>${ico}</span>${label}</button>`).join('');
$('#app').scrollTop=0;
}
document.addEventListener('click',ev=>{
const node=ev.target.closest('[data-act]');if(!node)return;const action=node.dataset.act;
if(titles[action])return go(action);
if(action==='photo'){state.photo=true;state.lastMessage='photo';return render()}
if(action==='cleartext'){let t=$('#ocrText');if(t){t.value='';t.focus()}return}
if(action==='confirmtext'){const t=$('#ocrText');if(!t||!t.value.trim()){alert('문제 내용을 입력해 주세요.');return}state.draft=t.value.trim();state.reviewSignature=state.draft;state.lastMessage='ocr';return render()}
if(action==='savephoto'){state.photoOnly=true;state.recordSaved=true;state.events.push({date:'11/15',title:'사진 임시 등록',desc:'가상 저장 · 내용 검토 필요'});return go('W04')}
if(action==='save'){if(state.lastMessage!=='ocr'){alert('문제 내용을 고친 뒤 직접 고쳐서 확인 버튼을 눌러주세요.');return}const t=$('#ocrText');if(t&&t.value.trim()!==state.reviewSignature){alert('수정한 문제 문장을 다시 확인해 주세요.');return}if(!t||!t.value.trim()){alert('부모가 문제 내용을 확인해 주세요.');return}state.recordTitle=t.value.trim();state.recordSaved=true;state.photoOnly=false;state.events.push({date:'11/15',title:'문제 검토 완료',desc:'가상 등록 · 부모 확정'});return go('W04')}
if(action.startsWith('answer:')){state.answer=Number(action.split(':')[1]);return render()}
if(action==='submitanswer'){if(state.answer===null){alert('답을 하나 선택해 주세요.');return}state.attempts++;state.events.push({date:'11/15',title:'아이 재풀이',desc:'가상 답 '+state.answer+'개 선택'});return go('W07')}
if(action==='saveobserve'){state.observation=$('#observe').value;state.confidence=$('#confidence').value;state.events.push({date:'11/15',title:'부모 관찰 메모',desc:'사실 관찰 기록 · 정답률과 별개'});return go('W09')}
if(action==='saveschedule'){state.reviewDate=$('#reviewDate').value;state.checkDone=$('#checkDone').checked;state.events.push({date:'11/15',title:'재확인 일정 기록',desc:state.checkDone?'확인 완료 표시':'미래 재확인 미확인'});return go('W10')}
});
document.addEventListener('change',ev=>{if(ev.target.id==='listFilter'){state.filter=ev.target.value;render()}});
render();
</script></body></html>
