name: WRONG QA82 only NEW two-retry accumulated parent DOM 320px
on:
  push:
    branches: ['qa/wrong-two-retries-parent-dom-20261115-1159']
    paths:
      - 'tests/qa82-two-retries-parent-dom-chromium.mjs'
      - '.github/workflows/wrong-qa82-two-retries-once.yml'
permissions:
  contents: write
jobs:
  new-two-retries-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new QA82 script syntax only
        run: node --check tests/qa82-two-retries-parent-dom-chromium.mjs
