name: WRONG P4 synthetic v02 event ledger backup risk fail-closed
on:
  push:
    branches: ['qa/wrong-p4-backup-ledger-risk-20261111']
    paths:
      - 'scripts/wrong-p4-synthetic-ledger-preflight.mjs'
      - 'tests/wrong-p4-backup-ledger-risk.mjs'
      - '.github/workflows/wrong-p4-backup-ledger-risk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wrong-p4-ledger-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      stage_postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa39_admin
          POSTGRES_PASSWORD: QA39_SYNTHETIC_CI_ONLY_2026
          POSTGRES_DB: qa39_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa39_admin -d qa39_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Check P3 fixed base and no production/A edits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin dfbc30ca8073f296fa543d25475f9ef7772cc7f0
          test "$(git hash-object index.html)" = "58754380d6fa764256100963d1a9da5d11873d19"
          test -z "$(git diff --name-only dfbc30ca8073f296fa543d25475f9ef7772cc7f0 HEAD -- index.html db supabase scripts/qa44-supabase-family-store.mjs scripts/wrong-p3-local-timeline-server.mjs)"
          git diff --name-only dfbc30ca8073f296fa543d25475f9ef7772cc7f0 HEAD
          echo WRONG_P4_P3_A_UNCHANGED=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral PostgreSQL client only
        run: npm install --no-save pg@8.16.3
      - name: Run only new P4 restore-risk probes
        shell: bash
        env:
          QA44_STAGE_ONLY: '1'
          QA44_SYNTHETIC_CHILD_ONLY: '1'
          QA44_SYNTHETIC_GUARDIAN_OBS_ONLY: '1'
          WRONG_P4_SYNTHETIC_BACKUP_ONLY: '1'
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: |
          set -euo pipefail
          node --check scripts/wrong-p4-synthetic-ledger-preflight.mjs
          node --check tests/wrong-p4-backup-ledger-risk.mjs
          node tests/wrong-p4-backup-ledger-risk.mjs | tee /tmp/wrong-p4.log
          grep -q 'WRONG_P4_BACKUP_RISK_RESULT={"status":"PASS"' /tmp/wrong-p4.log
          echo WRONG_P4_READ_ONLY_RISK_PROBES=PASS
