permissions:
  contents: read

jobs:
  # Temporary isolated QA on the existing WRONG-010 Draft branch. Full QA stays unchanged.
  # A stable PASS here is evidence of repetitions, not proof that earlier flakiness was fixed.
  wrong009-stability:
    if: github.ref == 'refs/heads/feature/wrong010-multisubject-home-copy-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start ephemeral loopback HTTP app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/wrong009-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Repeat unchanged WRONG-009 real-app test five independent browser processes
        shell: bash
        run: |
          failures=0
          for attempt in 1 2 3 4 5; do
            echo "::group::WRONG-009 repeat $attempt of 5"
            if node tests/wrong009-nonmath-record-list-context.mjs; then
              echo "WRONG009_STABILITY_ATTEMPT=$attempt PASS"
            else
              echo "WRONG009_STABILITY_ATTEMPT=$attempt FAIL"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "WRONG009_STABILITY_RESULT attempts=5 failures=$failures"
          test "$failures" -eq 0
      - name: Keep synthetic failure evidence, including screenshot before retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrong009-stability-screenshots
          path: wrong009-ui-evidence/*.png
          retention-days: 7
          if-no-files-found: ignore

  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      qa39_postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa39_admin
          POSTGRES_PASSWORD: QA39_SYNTHETIC_CI_ONLY_2026
          POSTGRES_DB: qa39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa39_admin -d qa39_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout isolated QA repository
        uses: actions/checkout@v4
      - name: Rebuild and restore public QA source ZIP in a temporary folder
        run: |
          python3 scripts/create_source_snapshot.py --output-dir source-snapshot-output
          python3 tests/qa-source-restore.py --output-dir source-snapshot-output
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1 pg@8.16.3 jose@6.1.0
          npx playwright install --with-deps chromium
      - name: Start temporary local QA HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/qa-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: QA22 G14 source-notice lineage, AI mapping and approval truthfulness
        run: node tests/qa-curriculum-provenance.mjs
      - name: QA22 G15 local-only no-overwrite family merge preflight
        run: node tests/qa-family-sync-preflight.mjs
      - name: QA25 G15 synthetic family authentication and two-device conflict loopback gateway
        run: node tests/qa-family-gateway.mjs
      - name: QA26 G15 encrypted restart recovery, two-family separation and fail-closed tamper
        run: node tests/qa-family-durable.mjs
      - name: QA27 G15 two isolated real browser apps through restartable encrypted test gateway
        run: node tests/qa-cross-device-roundtrip.mjs
      - name: QA22 G16 synthetic study measurement and privacy readiness
        run: node tests/qa-learning-study-readiness.mjs
      - name: QA37 G15 offline-safe app exchange and ambiguous PUT confirmation with original QA34-35 regressions
        run: node tests/qa-app-sync-bridge.mjs
      - name: QA33 G15 bounded login attempt guard, 5-session limit, expiry and two real browsers
        run: node tests/qa-family-abuse-guard.mjs
      - name: QA36 G15 encrypted login backoff persistent across restart and family deletion
        run: node tests/qa-family-lockout-restart.mjs
      - name: QA38 G15 limiter capacity fail closed, restart and account saturation
        run: node tests/qa-security-capacity.mjs
      - name: QA38 G15 G16 evidence based external-release blockers and no child data claims
        run: node tests/qa-release-gates.mjs
      - name: QA39 G15 real isolated PostgreSQL RLS, guardian revocation and conditional family writes
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa39-postgres-tenant.mjs
      - name: QA40 G15 signed synthetic OIDC token verification with PostgreSQL guardian RLS
