      - name: QA43 step 1 release config, role, secrets, OIDC and guardian approval fail closed
        run: node tests/qa43-ops-preflight.mjs
      - name: QA43 step 2 AES-GCM family backups, PostgreSQL disaster restore, CAS, deletion, revocation
