      - 'data/concept-graph-v0.3-demo.json'
      - 'data/concept-graph.schema.json'
      - '.github/workflows/qa-e2e.yml'

permissions:
  contents: read

jobs:
  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      qa39_postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa39_admin
          POSTGRES_PASSWORD: QA39_SYNTHETIC_CI_ONLY_2026
          POSTGRES_DB: qa39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa39_admin -d qa39_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout isolated QA repository
        uses: actions/checkout@v4
      - name: Rebuild and restore public QA source ZIP in a temporary folder
        run: |
          python3 scripts/create_source_snapshot.py --output-dir source-snapshot-output
          python3 tests/qa-source-restore.py --output-dir source-snapshot-output
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1 pg@8.16.3 jose@6.1.0
          npx playwright install --with-deps chromium
      - name: Start temporary local QA HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/qa-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: QA22 G14 source-notice lineage, AI mapping and approval truthfulness
        run: node tests/qa-curriculum-provenance.mjs
      - name: QA22 G15 local-only no-overwrite family merge preflight
        run: node tests/qa-family-sync-preflight.mjs
      - name: QA25 G15 synthetic family authentication and two-device conflict loopback gateway
        run: node tests/qa-family-gateway.mjs
      - name: QA26 G15 encrypted restart recovery, two-family separation and fail-closed tamper
        run: node tests/qa-family-durable.mjs
      - name: QA27 G15 two isolated real browser apps through restartable encrypted test gateway
        run: node tests/qa-cross-device-roundtrip.mjs
      - name: QA22 G16 synthetic study measurement and privacy readiness
        run: node tests/qa-learning-study-readiness.mjs
      - name: QA37 G15 offline-safe app exchange and ambiguous PUT confirmation with original QA34-35 regressions
        run: node tests/qa-app-sync-bridge.mjs
      - name: QA33 G15 bounded login attempt guard, 5-session limit, expiry and two real browsers
        run: node tests/qa-family-abuse-guard.mjs
      - name: QA36 G15 encrypted login backoff persistent across restart and family deletion
        run: node tests/qa-family-lockout-restart.mjs
      - name: QA38 G15 limiter capacity fail closed, restart and account saturation
        run: node tests/qa-security-capacity.mjs
      - name: QA38 G15 G16 evidence based external-release blockers and no child data claims
        run: node tests/qa-release-gates.mjs
      - name: QA39 G15 real isolated PostgreSQL RLS, guardian revocation and conditional family writes
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa39-postgres-tenant.mjs
      - name: QA40 G15 signed synthetic OIDC token verification with PostgreSQL guardian RLS
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa40-oidc-postgres.mjs
      - name: QA41 G15 signed family HTTP API, Chromium Origin/CORS and PostgreSQL guarded ETag CAS
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa41-http-api.mjs
      - name: QA42 G15 actual app signed JWT Postgres, 3 browsers, backup photos, offline conflict and role revocation
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa42-native-app-http.mjs
      - name: QA43 step 1 release config, role, secrets, OIDC and guardian approval fail closed
        run: node tests/qa43-ops-preflight.mjs
      - name: QA43 step 2 AES-GCM family backups, PostgreSQL disaster restore, CAS, deletion, revocation
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa43-postgres-recovery.mjs
      - name: QA43 step 3 320 390px mobile keyboard offline expired session and origin checks
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa43-mobile-release.mjs
      - name: QA43 step 4 privacy guardian research and launch draft contract enforcement
        run: node tests/qa43-docs-contract.mjs
      - name: QA44 Google/email SDK adapter, signup recovery logout and independent legal guardian consent gate
        run: node tests/qa44-supabase-auth.mjs
      - name: QA44 Supabase family and private photo policies in real ephemeral Postgres with mocked auth/storage schemas
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa44-supabase-postgres-rls.mjs
      - name: QA44 verified server-only writer, signed backup, CAS, photo and guardian revocation
        env:
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: node tests/qa44-supabase-family-store.mjs
      - name: QA44 free quota, no paid overage, SMTP secret reference and per-photo budget
        run: node tests/qa44-free-budget.mjs
      - name: QA44 actual app Settings synthetic Google/email sign-in in 320 and 390px Chromium
        run: node tests/qa44-mobile-auth-ui.mjs
      - name: QA45 live Free organization precreate no project no billing and real approval gate
        run: node tests/qa45-no-project-guard.mjs
      - name: QA47 protected live Supabase Edge gateway synthetic JWT/RLS response boundary
        run: node tests/qa47-edge-auth-status.mjs
      - name: QA47 actual app real Supabase email login local-only integration (320/390px, SDK mock in CI)
        run: node tests/qa47-live-auth-ui.mjs
      - name: QA48 Google OAuth PKCE public QA-only callback, verification, sign-out, and denial (320/390px, SDK mock in CI)
        run: node tests/qa48-google-oauth-ui.mjs
      - name: QA49 actual browser load of public Supabase CDN SDK and safely intercepted Google authorization (no user login)
        run: node tests/qa49-real-sdk-network-smoke.mjs
      - name: QA32 G15 password rotation, all-device session revocation, AES restart and slow PUT race
        run: node tests/qa-family-password-rotation.mjs
      - name: QA31 G15 authenticated family deletion, revocation, encrypted restart, in-flight race and browser confirmation
        run: node tests/qa-family-delete.mjs
      - name: QA30 G15 explicit three-way merge commit, encrypted base history, concurrent stream-write race
        run: node tests/qa-family-merge-commit.mjs
      - name: QA30 G15 two real browser devices explicitly approve non-conflicting merge
        run: node tests/qa-family-merge-ui.mjs
      - name: QA29 G15 user-visible loopback family sync lab, strict CORS and refusal on public origin
        run: node tests/qa-family-sync-lab.mjs
      - name: QA28 G15 reversible three-way independent edit preview and authenticated conflict endpoint
        run: node tests/qa-family-threeway.mjs
      - name: QA28 G16 prospective study assumptions and external approval gates
        run: node tests/qa-study-plan.mjs
      - name: QA27 G16 missing-data attrition sensitivity and protocol boundaries
        run: node tests/qa-study-sensitivity.mjs
      - name: Mathematics pilot and graph-data consistency checks
        run: node tests/qa-content.mjs
      - name: Real Chromium backup/restore and two-tab UI scenarios
        run: node tests/qa-e2e.mjs
      - name: Synthetic mobile camera and OCR UI scenarios
        run: node tests/qa-mobile-ocr.mjs
      - name: Full 500-record capacity and two-tab preservation
        run: node tests/qa-capacity.mjs
      - name: New same-denominator fraction learning path
        run: node tests/qa-same-denominator.mjs
      - name: Safe 256-attempt history continuation and full evidence export
        run: node tests/qa-history-continuation.mjs
      - name: Parent evidence report, privacy CSV and stale-tab checks
        run: node tests/qa-parent-report.mjs
      - name: QA8 temporary OCR image rotation/contrast and manual fallback
        run: node tests/qa-ocr-preprocess.mjs
      - name: QA9 focused learning navigation and unsaved draft safeguards
        run: node tests/qa-workflow-ux.mjs
      - name: WRONG-002 real app end-to-end parent/child workflow, 320px 390px, synthetic records
        run: node tests/wrong002-core-journey.mjs
      - name: WRONG-003 actual app first-use, photo-only completion and photo integrity 320/390px
        run: node tests/wrong003-first-use-photo-flow.mjs
      - name: QA10 all-record retry and intact JSON backup roundtrip
        run: node tests/qa-general-retry.mjs
      - name: QA11 general concept map and ambiguous candidate protection
        run: node tests/qa-concept-support.mjs
      - name: QA12 G11 synthetic parent observation transitions and evidence-only CSV
        run: node tests/qa-evidence-transition.mjs
      - name: QA13 G04 graph schema, reference and approval safeguards
        run: node tests/qa-graph-contract.mjs
      - name: QA14 G12 failure-path, non-destructive restore and full-byte recovery
        run: node tests/qa-backup-recovery.mjs
      - name: QA15 G02 two-tab CRUD, stale delete and edit preservation
        run: node tests/qa-record-lifecycle.mjs
      - name: QA16 G13 keyboard navigation, responsive routes and OCR offline fallbacks
        run: node tests/qa-mobile-accessibility.mjs
      - name: QA17 G10 child/parent presentation mode, unsaved drafts and non-persistent controls
        run: node tests/qa-role-modes.mjs
      - name: QA18 G08 256-attempt complete backup restoration and invalid history rejection
        run: node tests/qa-history-restore.mjs
      - name: QA19 G09 parent planned review, recheck, stale tab and lossless observation restore
        run: node tests/qa-parent-review-cycle.mjs
      - name: QA20 G03 G05 G06 G07 diagnosis-safe causes, graph, manipulatives, transfer
        run: node tests/qa-learning-four-goals.mjs
      - name: QA21 G01 synthetic mobile photo intake and lossless restore
        run: node tests/qa-photo-intake.mjs
      - name: Keep screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-qa-browser-failure
          path: |
            qa-e2e-failure.png
            qa-mobile-failure.png
            qa-boundary-failure.png
            qa-same-den-failure.png
            qa-archive-failure.png
            qa-parent-report-failure.png
            qa-ocr-preprocess-failure.png
            qa-workflow-ux-failure.png
            qa-general-retry-failure.png
            qa11-concept-failure.png
            qa12-evidence-failure.png
            qa14-recovery-failure.png
            qa15-crud-failure.png
            qa16-mobile-failure.png
            qa17-modes-failure.png
            qa18-history-recovery-failure.png
            qa19-review-cycle-failure.png
            qa20-four-goals-failure.png
            qa21-photo-failure.png
          if-no-files-found: ignore
