name: Isolated QA browser tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'check.html'
      - 'tests/qa-e2e.mjs'
      - 'tests/qa-mobile-ocr.mjs'
      - 'tests/qa-content.mjs'
      - 'tests/qa-capacity.mjs'
      - 'tests/qa-same-denominator.mjs'
      - 'tests/qa-history-continuation.mjs'
      - 'tests/qa-parent-report.mjs'
      - 'tests/qa-ocr-preprocess.mjs'
      - 'tests/qa-workflow-ux.mjs'
      - '.github/workflows/qa-e2e.yml'

permissions:
  contents: read

jobs:
  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated QA repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start temporary local QA HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/qa-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Mathematics pilot and graph-data consistency checks
        run: node tests/qa-content.mjs
      - name: Real Chromium backup/restore and two-tab UI scenarios
        run: node tests/qa-e2e.mjs
      - name: Synthetic mobile camera and OCR UI scenarios
        run: node tests/qa-mobile-ocr.mjs
      - name: Full 500-record capacity and two-tab preservation
        run: node tests/qa-capacity.mjs
      - name: New same-denominator fraction learning path
        run: node tests/qa-same-denominator.mjs
      - name: Safe 256-attempt history continuation and full evidence export
        run: node tests/qa-history-continuation.mjs
      - name: Parent evidence report, privacy CSV and stale-tab checks
        run: node tests/qa-parent-report.mjs
      - name: QA8 temporary OCR image rotation/contrast and manual fallback
        run: node tests/qa-ocr-preprocess.mjs
      - name: QA9 focused learning navigation and unsaved draft safeguards
        run: node tests/qa-workflow-ux.mjs
      - name: Keep screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-qa-browser-failure
          path: |
            qa-e2e-failure.png
            qa-mobile-failure.png
            qa-boundary-failure.png
            qa-same-den-failure.png
            qa-archive-failure.png
            qa-parent-report-failure.png
            qa-ocr-preprocess-failure.png
            qa-workflow-ux-failure.png
          if-no-files-found: ignore
