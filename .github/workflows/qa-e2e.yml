name: Isolated QA browser tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'check.html'
      - 'tests/qa-e2e.mjs'
      - 'tests/qa-mobile-ocr.mjs'
      - 'tests/qa-content.mjs'
      - 'tests/qa-capacity.mjs'
      - 'tests/qa-same-denominator.mjs'
      - 'tests/qa-history-continuation.mjs'
      - 'tests/qa-parent-report.mjs'
      - 'tests/qa-ocr-preprocess.mjs'
      - 'tests/qa-workflow-ux.mjs'
      - 'tests/qa-general-retry.mjs'
      - 'tests/qa-concept-support.mjs'
      - 'tests/qa-evidence-transition.mjs'
      - 'tests/qa-graph-contract.mjs'
      - 'tests/qa-backup-recovery.mjs'
      - 'tests/qa-record-lifecycle.mjs'
      - 'tests/qa-mobile-accessibility.mjs'
      - 'tests/qa-role-modes.mjs'
      - 'tests/qa-history-restore.mjs'
      - 'data/concept-graph-v0.3-demo.json'
      - 'data/concept-graph.schema.json'
      - '.github/workflows/qa-e2e.yml'

permissions:
  contents: read

jobs:
  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated QA repository
        uses: actions/checkout@v4
      - name: Rebuild and restore public QA source ZIP in a temporary folder
        run: |
          python3 scripts/create_source_snapshot.py --output-dir source-snapshot-output
          python3 tests/qa-source-restore.py --output-dir source-snapshot-output
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start temporary local QA HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/qa-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Mathematics pilot and graph-data consistency checks
        run: node tests/qa-content.mjs
      - name: Real Chromium backup/restore and two-tab UI scenarios
        run: node tests/qa-e2e.mjs
      - name: Synthetic mobile camera and OCR UI scenarios
        run: node tests/qa-mobile-ocr.mjs
      - name: Full 500-record capacity and two-tab preservation
        run: node tests/qa-capacity.mjs
      - name: New same-denominator fraction learning path
        run: node tests/qa-same-denominator.mjs
      - name: Safe 256-attempt history continuation and full evidence export
        run: node tests/qa-history-continuation.mjs
      - name: Parent evidence report, privacy CSV and stale-tab checks
        run: node tests/qa-parent-report.mjs
      - name: QA8 temporary OCR image rotation/contrast and manual fallback
        run: node tests/qa-ocr-preprocess.mjs
      - name: QA9 focused learning navigation and unsaved draft safeguards
        run: node tests/qa-workflow-ux.mjs
      - name: QA10 all-record retry and intact JSON backup roundtrip
        run: node tests/qa-general-retry.mjs
      - name: QA11 general concept map and ambiguous candidate protection
        run: node tests/qa-concept-support.mjs
      - name: QA12 G11 synthetic parent observation transitions and evidence-only CSV
        run: node tests/qa-evidence-transition.mjs
      - name: QA13 G04 graph schema, reference and approval safeguards
        run: node tests/qa-graph-contract.mjs
      - name: QA14 G12 failure-path, non-destructive restore and full-byte recovery
        run: node tests/qa-backup-recovery.mjs
      - name: QA15 G02 two-tab CRUD, stale delete and edit preservation
        run: node tests/qa-record-lifecycle.mjs
      - name: QA16 G13 keyboard navigation, responsive routes and OCR offline fallbacks
        run: node tests/qa-mobile-accessibility.mjs
      - name: QA17 G10 child/parent presentation mode, unsaved drafts and non-persistent controls
        run: node tests/qa-role-modes.mjs
      - name: QA18 G08 256-attempt complete backup restoration and invalid history rejection
        run: node tests/qa-history-restore.mjs
      - name: Keep screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-qa-browser-failure
          path: |
            qa-e2e-failure.png
            qa-mobile-failure.png
            qa-boundary-failure.png
            qa-same-den-failure.png
            qa-archive-failure.png
            qa-parent-report-failure.png
            qa-ocr-preprocess-failure.png
            qa-workflow-ux-failure.png
            qa-general-retry-failure.png
            qa11-concept-failure.png
            qa12-evidence-failure.png
            qa14-recovery-failure.png
            qa15-crud-failure.png
            qa16-mobile-failure.png
            qa17-modes-failure.png
            qa18-history-recovery-failure.png
          if-no-files-found: ignore
