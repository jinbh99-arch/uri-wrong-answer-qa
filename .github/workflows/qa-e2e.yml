name: Isolated QA browser tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'check.html'
      - 'tests/qa-e2e.mjs'
      - '.github/workflows/qa-e2e.yml'

permissions:
  contents: read

jobs:
  qa-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated QA repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for isolated Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start temporary local QA HTTP server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/qa-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Real Chromium backup/restore and two-tab UI scenarios
        run: node tests/qa-e2e.mjs
      - name: Keep screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-qa-browser-failure
          path: qa-e2e-failure.png
          if-no-files-found: ignore
