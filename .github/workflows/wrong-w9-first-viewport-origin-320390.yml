name: WRONG W9 first-viewport origin dual-capture 320 390
on:
  push:
    branches: ['qa/wrong-w9-viewport-origin-recapture-20261120']
    paths:
      - 'tests/wrong-w9-first-viewport-recapture-320-390.mjs'
      - '.github/workflows/wrong-w9-first-viewport-origin-320390.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w9-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WRONG_W9_DEV_SHA: 3eac1ec8fbf9a38b75ca317c4088dd9c759ac39b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin synthetic app bytes and prohibit product patch
        run: |
          set -eu
          test "$(git rev-parse HEAD:index.html)" = 250aff5b0a46490488b64f7b96a83c940d2d6c71
          test "$(git rev-parse "$WRONG_W9_DEV_SHA:index.html")" = "$(git rev-parse HEAD:index.html)"
          git diff --exit-code "$WRONG_W9_DEV_SHA" HEAD -- index.html scripts/qa66-wrong-loopback-preview.mjs
          node --check tests/wrong-w9-first-viewport-recapture-320-390.mjs
          echo WRONG_W9_APP_ORIGINAL_BYTES_INTACT
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Native 200 percent first Tab, Enter, DOM and separate visible tab captures
        run: node tests/wrong-w9-first-viewport-recapture-320-390.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrong-w9-first-viewport-origin-320-390-proof
          path: qa-proof/w9-first-viewport-origin/**/*
          if-no-files-found: warn
          retention-days: 7
