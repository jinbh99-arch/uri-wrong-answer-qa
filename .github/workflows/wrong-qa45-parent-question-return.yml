name: WRONG QA45 parent source return to help queue
on:
  push:
    branches: ['qa/wrong-parent-question-return-20261114']
    paths:
      - 'index.html'
      - 'tests/qa45-parent-question-return-queue-dom.mjs'
      - '.github/workflows/wrong-qa45-parent-question-return.yml'
permissions:
  contents: read
jobs:
  parent-queue-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New actual source Node synthetic DOM only
        run: |
          node --check tests/qa45-parent-question-return-queue-dom.mjs
          node tests/qa45-parent-question-return-queue-dom.mjs
      - name: Print exact isolated QA SHA no deployment
        run: |
          echo "WRONG_QA45_SHA=$(git rev-parse HEAD)"
          echo "WRONG_QA45_DEPLOYMENT=false"
# No old test or Chromium reruns, no real child data and no release.
