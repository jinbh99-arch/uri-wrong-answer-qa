name: WRONG A18-17 synthetic parent photo retry observation journey
on:
  push:
    branches: ['qa/wrong-a18-17-parent-photo-retry-observe-20261117-2210']
    paths:
      - 'tests/wrong-a18-17-parent-photo-retry-observe.mjs'
      - '.github/workflows/wrong-a18-17-parent-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-parent-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stable unchanged QA app and new script syntax
        run: |
          test "$(git hash-object index.html)" = "f3f0d3c2dffce09ed7af613238aa7f8a92708c35"
          node --check tests/wrong-a18-17-parent-photo-retry-observe.mjs
          echo 'A1817_APP_UNCHANGED_SOURCE_BLOB_PASS'
      - name: Isolated Chromium runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: NEW synthetic real UI parent photo retry review and reload 320/390
        run: node tests/wrong-a18-17-parent-photo-retry-observe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrong-a18-17-parent-journey-photo-retry-observe
          path: qa-proof/wrong-a18-17/**/*
          if-no-files-found: warn
          retention-days: 7
