name: WRONG A18-15 real app three-store full bytes after clear click
on:
  push:
    branches: ['qa/wrong-a18-15-real-idb-clear-click-evidence-20261117-1910']
    paths:
      - 'index.html'
      - 'qa/a18_15_locked_clear_notice.py'
      - 'tests/wrong-a18-15-real-app-idb-clear-click-chromium.mjs'
      - '.github/workflows/wrong-a18-15-real-idb-clear-click.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-app-full-idb:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact A18-14 candidate application / full original byte reversal
        run: |
          python3 - <<'PY'
          from qa.a18_14_clear_ux import apply as apply14
          from qa.a18_15_locked_clear_notice import apply as apply15
          import subprocess
          from pathlib import Path
          old=subprocess.check_output(['git','show','3ab034bc695984f926bd56141bcc6be63b0acb3f:index.html'])
          candidate=Path('index.html').read_bytes()
          assert old!=candidate
          assert apply15(apply14(old))==candidate, 'QA app differs from exact A18-14 + A18-15 patch chain'
          assert apply14(apply15(candidate,reverse=True),reverse=True)==old, 'reverse patch full source bytes differ'
          print('A1815_LOCKED_STORAGE_WARNING_PATCH_REVERSE_BYTES_PASS')
          PY
          test "$(git hash-object index.html)" = "d611cb6e6b7d8afb70299fe96cca78e926a2670c"
          node --check tests/wrong-a18-15-real-app-idb-clear-click-chromium.mjs
      - name: Install supported Chromium isolated
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: NEW real IndexedDB photos/records/history/pending before-after on 320 and 390 click
        run: node tests/wrong-a18-15-real-app-idb-clear-click-chromium.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrong-a18-15-real-idb-full-photo-parent-pending
          path: qa-proof/wrong-a18-15/**/*
          if-no-files-found: warn
          retention-days: 7
