name: WRONG QA88 W7 post-hash pre-IDB transaction race
on:
  push:
    branches: ['qa/wrong-w7-posthash-pretx-race-20261115-1413']
    paths:
      - 'tests/qa88-w7-posthash-pretx-race-chromium.mjs'
      - '.github/workflows/wrong-qa88-posthash-race.yml'
permissions:
  contents: write
jobs:
  new-posthash-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/qa88-w7-posthash-pretx-race-chromium.mjs
      - name: Chromium only for new race; never rerun QA87
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Guard actual app in ephemeral localhost HTML response
        env:
          WRONG_QA88_DEV_SHA: '9e68c3993b80f407b72945fcc9c77ddd87660b4d'
        run: node tests/qa88-w7-posthash-pretx-race-chromium.mjs
      - name: Remove one-time job only after new QA88 PASS
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-w7-posthash-pretx-race-20261115-1413'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/wrong-qa88-posthash-race.yml
          git diff --cached --check
          git commit -m 'chore(qa88): remove one-time passing W7 race CI'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload new synthetic screenshot and outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa88-w7-posthash-pretx-synthetic-race
          path: qa-proof/qa88/*
          retention-days: 7
          if-no-files-found: warn
# No real family, real backups, hosted environment, secrets or operational storage.
