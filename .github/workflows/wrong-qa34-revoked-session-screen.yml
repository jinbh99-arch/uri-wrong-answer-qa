name: WRONG QA34 revoked session local privacy
on:
  push:
    branches: ['qa/wrong-revoked-session-screen-guard-20261114']
    paths: ['.github/workflows/wrong-qa34-revoked-session-screen.yml']
permissions:
  contents: read
jobs:
  revoked-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/qa-inapp-sync-bridge.mjs
          node --check tests/qa34-revoked-session-screen.mjs
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start loopback-only synthetic app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wrong-revoked.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify revoked-session UI privacy once
        env:
          QA_SYNTHETIC_FAMILY_ONLY: '1'
        run: node tests/qa34-revoked-session-screen.mjs
      - run: echo "NO_DEPLOYMENT=true"
