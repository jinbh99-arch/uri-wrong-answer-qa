name: WRONG A01 corrected mock OCR to child retry parent observation (isolated)
on:
  push:
    branches: ['qa/wrong-a-ocr-corrected-retry-observation-20261116-0953']
    paths:
      - 'tests/wrong-a01-ocr-correction-child-parent-journey.mjs'
      - '.github/workflows/wrong-a01-synthetic-ocr-journey.yml'
permissions:
  contents: read
jobs:
  synthetic-one-record-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check new integration only
        run: node --check tests/wrong-a01-ocr-correction-child-parent-journey.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: NEW A01 user path, actual local app + mock OCR
        env:
          WRONG_A01_DEV_SHA: '3eac1ec8fbf9a38b75ca317c4088dd9c759ac39b'
        run: node tests/wrong-a01-ocr-correction-child-parent-journey.mjs
      - name: Preserve synthetic mobile proof (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrong-a01-corrected-ocr-child-parent-320-390-synthetic
          path: qa-proof/wrong-a01/*
          retention-days: 7
          if-no-files-found: warn
# No release, deploy, Supabase, real OCR, private accounts, restore, or CI of older QA.
