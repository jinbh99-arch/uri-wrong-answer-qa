name: WRONG QA73 320px integrated child parent visibility
on:
  push:
    branches: ['qa/wrong-320-child-parent-screen-residue-20261114-2220']
    paths:
      - 'tests/qa73-320-child-parent-screen-residue-chromium.mjs'
      - '.github/workflows/wrong-qa73-child-parent-screen-residue.yml'
permissions:
  contents: read
jobs:
  combined-320px:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check only new QA73 script syntax
        run: node --check tests/qa73-320-child-parent-screen-residue-chromium.mjs
      - name: Install isolated Chromium dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: New 320px local connected flow; fake records only
        env:
          WRONG_QA73_SOURCE_DEV_SHA: '73b759cbb6071878472e3149d9a796437a1c4e8b'
        run: node tests/qa73-320-child-parent-screen-residue-chromium.mjs
# No public preview, operational data, changes to existing app, or deployment.
