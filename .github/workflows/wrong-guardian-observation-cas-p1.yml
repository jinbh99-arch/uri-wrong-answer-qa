name: WRONG guardian same-record observation append CAS synthetic P1
on:
  push:
    branches: ['qa/wrong-guardian-observation-cas-p1-20261110']
    paths:
      - 'scripts/qa44-supabase-family-store.mjs'
      - 'db/qa44_guardian_observation_stage_only.sql'
      - 'tests/wrong-guardian-observation-cas-p1.mjs'
      - '.github/workflows/wrong-guardian-observation-cas-p1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  only-guardian-observation-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      temporary_postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa39_admin
          POSTGRES_PASSWORD: QA39_SYNTHETIC_CI_ONLY_2026
          POSTGRES_DB: qa39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa39_admin -d qa39_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert A v1.4, B2 RLS and app untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "58754380d6fa764256100963d1a9da5d11873d19"
          git fetch --no-tags origin 0f03e74cd2734f3ab05a8403c228132d3f6cafa8
          test -z "$(git diff --name-only 0f03e74cd2734f3ab05a8403c228132d3f6cafa8 HEAD -- index.html db/qa44_supabase_staging_rls.sql db/qa44_child_retry_stage_only.sql scripts/qa-family-merge-preflight.mjs)"
          git diff --name-only 0f03e74cd2734f3ab05a8403c228132d3f6cafa8 HEAD
          echo WRONG_A_B2_SOURCE_UNMODIFIED=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only synthetic PG test dependency
        run: npm install --no-save pg@8.16.3
      - name: Narrow B3 code syntax
        run: |
          node --check scripts/qa44-supabase-family-store.mjs
          node --check tests/wrong-guardian-observation-cas-p1.mjs
      - name: Run ONLY new guardian observation CAS regression
        shell: bash
        env:
          QA44_STAGE_ONLY: '1'
          QA44_SYNTHETIC_CHILD_ONLY: '1'
          QA44_SYNTHETIC_GUARDIAN_OBS_ONLY: '1'
          QA39_TEST_DATABASE_URL: postgres://qa39_admin:QA39_SYNTHETIC_CI_ONLY_2026@127.0.0.1:5432/qa39_ci
        run: |
          set -euo pipefail
          node tests/wrong-guardian-observation-cas-p1.mjs | tee /tmp/wrong-guardian-p1.log
          grep -q 'WRONG_GUARDIAN_OBS_P1_RESULT={"status":"PASS"' /tmp/wrong-guardian-p1.log
          echo WRONG_GUARDIAN_P1_ONLY=PASS
