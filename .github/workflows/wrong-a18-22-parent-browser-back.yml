name: WRONG A18-22 parent failed-save browser back Chromium
on:
  push:
    branches: ['qa/wrong-a18-22-parent-back-20261118']
    paths:
      - 'index.html'
      - 'tests/wrong-a18-22-parent-browser-back.mjs'
      - '.github/workflows/wrong-a18-22-parent-browser-back.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parent-browser-back:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify prior QA original and optional isolated A18-22 exact reverse patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from qa.a18_16a_clear_live_patch import apply as apply16a
          from qa.a18_21_parent_draft_nav_patch import apply as apply21
          base=subprocess.check_output(['git','show','2a070c134511a6b402f3f3c7154c0ab610e1f55f:index.html'])
          original=apply16a(base)
          inherited=apply21(original)
          current=Path('index.html').read_bytes()
          if current != inherited:
              from qa.a18_22_parent_browser_back_patch import apply as apply22
              assert apply22(inherited)==current
              assert apply22(current,reverse=True)==inherited
              print('A1822_ISOLATED_FORWARD_REVERSE_BYTES_PASS')
          else:
              print('A1822_UNPATCHED_BEFOREUNLOAD_EXPECTED_RED')
          assert apply21(inherited,reverse=True)==original
          assert apply16a(original,reverse=True)==base
          print('A1822_FULL_QA_INHERITANCE_REVERSE_BYTES_PASS')
          PY
          node --check tests/wrong-a18-22-parent-browser-back.mjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Failed save browser back 320 and 390
        run: node tests/wrong-a18-22-parent-browser-back.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrong-a18-22-parent-browser-back-proof
          path: qa-proof/wrong-a18-22/**/*
          if-no-files-found: warn
          retention-days: 7
