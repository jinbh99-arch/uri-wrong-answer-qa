name: WRONG QA34 stale cross-tab replies privacy
on:
  push:
    branches: ['qa/wrong-cross-tab-stale-login-race-20261114']
    paths:
      - 'scripts/qa-inapp-sync-bridge.mjs'
      - 'tests/qa34-stale-async-family-response.mjs'
      - '.github/workflows/wrong-qa34-stale-reply.yml'
permissions:
  contents: read
jobs:
  stale-reply-local-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual product and new test syntax only
        run: |
          node --check scripts/qa-inapp-sync-bridge.mjs
          node --check tests/qa34-stale-async-family-response.mjs
      - name: Isolated Chromium dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start exact loopback synthetic app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wrong-stale-reply.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify only new stale login and backup response race boundaries
        env:
          QA_SYNTHETIC_FAMILY_ONLY: '1'
        run: node tests/qa34-stale-async-family-response.mjs
      - name: Report exact candidate and no deployment
        run: |
          echo "WRONG_QA34_STALE_SHA=$(git rev-parse HEAD)"
          echo "WRONG_QA34_DEPLOYMENT=false"
# Synthetic localhost only. No production account, family data, raw backup artifact.
