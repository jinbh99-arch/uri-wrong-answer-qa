name: WRONG scoped record-detail Back contract, local-only A photo preservation
on:
  push:
    branches: ['qa/wrong-scoped-browser-back-contract-20261111']
    paths:
      - 'index.html'
      - 'tests/wrong-scoped-browser-back-contract-e2e.mjs'
      - '.github/workflows/wrong-scoped-browser-back-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-A-D-scoped-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure original A and main not modified; QA local-only history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin d212f7708c83a80bb94f652ba0ecc70ec4cd77c9
          git fetch --no-tags origin c7d413f311df5bc983bc63f18027ac18b0445f27
          test "$(git rev-parse c7d413f311df5bc983bc63f18027ac18b0445f27:index.html)" = "58754380d6fa764256100963d1a9da5d11873d19"
          test -z "$(git diff --name-only d212f7708c83a80bb94f652ba0ecc70ec4cd77c9 HEAD -- scripts db supabase)"
          grep -q "WRONG scoped-back EXPERIMENT" index.html
          grep -q "location.hostname==='127.0.0.1'" index.html
          echo WRONG_SCOPED_BACK_GUARD_ONLY_LOOPBACK_QA=PASS
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium / Korean glyphs
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Run real A one-D detail browser Back vs scoped test, no production data
        shell: bash
        env:
          WRONG_SCOPED_BACK_LOCAL_ONLY: '1'
        run: |
          set -euo pipefail
          node --check tests/wrong-scoped-browser-back-contract-e2e.mjs
          node tests/wrong-scoped-browser-back-contract-e2e.mjs | tee /tmp/wrong-scoped-back.log
          grep -q 'WRONG_SCOPED_BACK_RESULT={"status":"PASS"' /tmp/wrong-scoped-back.log
      - name: Publish before/after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WRONG_SCOPED_BACK_SINGLE_A_RECORD_SAFE_EVIDENCE
          path: test-results/wrong-scoped-back
          if-no-files-found: warn
          retention-days: 14
