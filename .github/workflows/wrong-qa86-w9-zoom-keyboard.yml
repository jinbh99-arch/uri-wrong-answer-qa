name: WRONG QA86 200 percent keyboard registration and recheck
on:
  push:
    branches: ['qa/wrong-w9-zoom200-keyboard-20261115']
    paths:
      - 'tests/qa86-w9-zoom200-keyboard-chromium.mjs'
      - '.github/workflows/wrong-qa86-w9-zoom-keyboard.yml'
permissions:
  contents: write
jobs:
  zoom200-keyboard-320px:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check only new QA86
        run: node --check tests/qa86-w9-zoom200-keyboard-chromium.mjs
      - name: Isolated Chromium installation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real Chromium 320px, 200% CSS zoom, keyboard
        env:
          WRONG_QA86_DEV_SHA: '4ce79f2c961e903427f583b9ffdb0b446520d7ea'
        run: node tests/qa86-w9-zoom200-keyboard-chromium.mjs
      - name: Remove one-off workflow if new QA86 passes
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-w9-zoom200-keyboard-20261115'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/wrong-qa86-w9-zoom-keyboard.yml
          git diff --cached --check
          git commit -m 'chore(qa86): remove passing one-off keyboard zoom workflow'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Retain new screenshots and text result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa86-w9-keyboard-zoom200-320px
          path: qa-proof/qa86/*
          retention-days: 7
          if-no-files-found: warn
# Synthetic local Chromium zoom emulation is NOT a real hardware/browser-menu zoom certification.
