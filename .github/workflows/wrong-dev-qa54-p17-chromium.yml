name: WRONG dev QA54 P17 mobile real Chromium
on:
  push:
    branches: ['qa/wrong-dev-p17-mobile-browser-20261114']
    paths:
      - 'tests/qa54-dev-p17-mobile-chromium.mjs'
      - '.github/workflows/wrong-dev-qa54-p17-chromium.yml'
permissions:
  contents: read
jobs:
  mobile-p17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check only new Chromium scenario syntax
        run: node --check tests/qa54-dev-p17-mobile-chromium.mjs
      - name: Install only real Chromium browser for new mobile scope
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve isolated localhost static source
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wrong-qa54.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Only new P17/P18/P19 mobile real Chromium
        env:
          QA_SYNTHETIC_FAMILY_ONLY: '1'
        run: node tests/qa54-dev-p17-mobile-chromium.mjs
      - name: Print exact QA source SHA; no deploy
        run: |
          echo "WRONG_QA54_SHA=$(git rev-parse HEAD)"
          echo "WRONG_QA54_DEPLOYMENT=false"
# No old suites, production API, real family data or release.
