name: WRONG W3 two additional parent dirty guards RED GREEN 320 390
on:
  push:
    branches: ['qa/wrong-w3-dirty-observation-question-guards-20261118']
    paths:
      - 'qa/w3_child_toast_mode_patch.py'
      - 'tests/wrong-w3-parent-two-guards-red-green.mjs'
      - '.github/workflows/wrong-w3-parent-two-guards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w3-parent-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin dev app blob, QA-only diff, JS/Python syntax
        run: |
          set -eu
          test "$(git rev-parse HEAD:index.html)" = 250aff5b0a46490488b64f7b96a83c940d2d6c71
          git diff --exit-code 3eac1ec8fbf9a38b75ca317c4088dd9c759ac39b HEAD -- index.html scripts/qa66-wrong-loopback-preview.mjs
          node --check tests/wrong-w3-parent-two-guards-red-green.mjs
          python3 -m py_compile qa/w3_child_toast_mode_patch.py
          echo W3_TWO_GUARDS_PINNED_DEV_AND_QA_ISOLATION_PASS
      - name: Install ephemeral Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: RED actual app and GREEN patch, then byte-exact reverse
        run: |
          set -eu
          node tests/wrong-w3-parent-two-guards-red-green.mjs red
          python3 qa/w3_child_toast_mode_patch.py
          node tests/wrong-w3-parent-two-guards-red-green.mjs green
          python3 qa/w3_child_toast_mode_patch.py --reverse
          git diff --exit-code HEAD -- index.html
          echo W3_TWO_GUARDS_EXACT_REVERSE_ORIGINAL_BYTES_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrong-w3-two-dirty-guards-red-green-320-390
          path: qa-proof/w3-two-guards/**/*
          if-no-files-found: warn
          retention-days: 7
