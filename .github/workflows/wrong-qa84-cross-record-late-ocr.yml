name: WRONG QA84 cross-record delayed OCR privacy (isolated)
on:
  push:
    branches: ['qa/wrong-w3-cross-record-late-ocr-20261115']
    paths:
      - 'tests/qa84-w3-cross-record-late-ocr-chromium.mjs'
      - '.github/workflows/wrong-qa84-cross-record-late-ocr.yml'
permissions:
  contents: write
jobs:
  cross-record-stale-ocr-320px:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new QA84 test syntax
        run: node --check tests/qa84-w3-cross-record-late-ocr-chromium.mjs
      - name: Install local Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: New cross-record OCR callback and child privacy probe
        env:
          WRONG_QA84_DEV_SHA: '0e910f1f09c0b29cbd8da91b799e40665bbf6e23'
        run: node tests/qa84-w3-cross-record-late-ocr-chromium.mjs
      - name: Remove one-time workflow only after PASS
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-w3-cross-record-late-ocr-20261115'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/wrong-qa84-cross-record-late-ocr.yml
          git diff --cached --check
          git commit -m 'chore(qa84): remove one-off OCR cross-record workflow after PASS'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload only new synthetic screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa84-cross-record-stale-ocr-320px
          path: qa-proof/qa84/*
          retention-days: 7
          if-no-files-found: warn
