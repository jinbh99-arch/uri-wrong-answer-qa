name: WRONG QA35 foreground lock after remote family deletion
on:
  push:
    branches: ['qa/wrong-foreground-revocation-lock-20261114']
    paths:
      - 'scripts/qa-inapp-sync-bridge.mjs'
      - 'tests/qa35-foreground-remote-delete-lock.mjs'
      - '.github/workflows/wrong-qa35-foreground-revocation.yml'
permissions:
  contents: read
jobs:
  actual-chromium-revocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check only changed QA presentation and new test
        run: |
          node --check scripts/qa-inapp-sync-bridge.mjs
          node --check tests/qa35-foreground-remote-delete-lock.mjs
      - name: Prepare a single actual Chromium scenario
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve actual isolated app only on loopback
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wrong-qa35-focus.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify delayed GET, remote delete, C collision and B retry in actual app
        env:
          QA_SYNTHETIC_FAMILY_ONLY: '1'
        run: node tests/qa35-foreground-remote-delete-lock.mjs
      - name: Record exact isolated SHA and no deploy
        run: |
          echo "WRONG_QA35_FOREGROUND_SHA=$(git rev-parse HEAD)"
          echo "WRONG_QA35_DEPLOYMENT=false"
# Synthetic localhost UI only; no real family, public app, deploy or main changes.
