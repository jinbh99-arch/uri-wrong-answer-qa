name: WRONG QA72 invalid parent date action in original record
on:
  push:
    branches: ['qa/wrong-invalid-parent-time-next-action-20261114-2215']
    paths:
      - 'tests/qa72-invalid-parent-time-next-action-chromium.mjs'
      - '.github/workflows/wrong-qa72-invalid-parent-time-next-action.yml'
permissions:
  contents: write
jobs:
  patch-and-verify-qa-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only 2 line additions to QA index source (no full rewrite)
        run: |
          git apply --check <<'PATCH'
          diff --git a/index.html b/index.html
          --- a/index.html
          +++ b/index.html
          @@ -1077,4 +1077,6 @@
             const elapsed=validTime?Math.floor((now-latest.time)/86400000):null;
             button.append(make('span','small wrong-parent-observation-age',
              elapsed===null?'관찰일 확인 불가':elapsed===0?'오늘 관찰':elapsed+'일 경과'));
          +  if(!validTime)button.append(make('span','small wrong-parent-time-next-action',
          +   '날짜 확인 필요 → 이 항목을 눌러 원문 관찰을 확인하세요.'));
             button.append(make('span','small wrong-parent-retry-after',wrongParentRetryAfterObservation(r,latest,now)));
          PATCH
          git apply <<'PATCH'
          diff --git a/index.html b/index.html
          --- a/index.html
          +++ b/index.html
          @@ -1077,4 +1077,6 @@
             const elapsed=validTime?Math.floor((now-latest.time)/86400000):null;
             button.append(make('span','small wrong-parent-observation-age',
              elapsed===null?'관찰일 확인 불가':elapsed===0?'오늘 관찰':elapsed+'일 경과'));
          +  if(!validTime)button.append(make('span','small wrong-parent-time-next-action',
          +   '날짜 확인 필요 → 이 항목을 눌러 원문 관찰을 확인하세요.'));
             button.append(make('span','small wrong-parent-retry-after',wrongParentRetryAfterObservation(r,latest,now)));
          PATCH
          git diff --check
          git diff --numstat -- index.html
          test "$(git diff --numstat -- index.html)" = "$(printf '2\t0\tindex.html')"
      - name: QA72 new test syntax
        run: node --check tests/qa72-invalid-parent-time-next-action-chromium.mjs
      - name: Install only Chromium for new parent-action browser route
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Actual 360px browser test with fictional parent history
        env:
          WRONG_QA72_SOURCE_DEV_SHA: 'cfb52fa8023af2d3ae4ce1ddc579e4bb4e366fac'
        run: node tests/qa72-invalid-parent-time-next-action-chromium.mjs
      - name: Commit tiny verified product patch on the same QA branch only
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-invalid-parent-time-next-action-20261114-2215'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m 'fix(wrong): guide parents to original review when observation time is invalid'
          git push origin "HEAD:$GITHUB_REF_NAME"
# Never touches dev/main, deploys a site, or reads operational data.
