name: WRONG QA80 one-time import of existing fixed-only synthetic gallery
on:
  push:
    branches:
      - 'qa/wrong-fixed-gallery-individual-png-20261115-0855'
    paths:
      - '.github/workflows/wrong-qa80-once-gallery.yml'
permissions:
  contents: write
  actions: read
jobs:
  import-existing-pngs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download only already verified QA79 screenshots (no rerun, no product test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43617826347 -R "$GITHUB_REPOSITORY" \
            -n qa79-one-record-320px-real-screenshots \
            --dir /tmp/wrong-qa80-screens
          test -d /tmp/wrong-qa80-screens/fixed
      - name: Verify original fixed-only PNG bytes and publish GitHub repository gallery
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil, struct
          root=pathlib.Path('/tmp/wrong-qa80-screens')
          output=pathlib.Path('docs/qa79-fixed-320px')
          output.mkdir(parents=True,exist_ok=True)
          manifest={
            '01-parent-entry.png':'567ffe842fbac764bc1c2aedb1009c9fff9276c19fbfcdc4965b2ba4be001d76',
            '02-parent-registration.png':'50afde17ae20f7120d6420e7bbb8f526b052d164e84a2b10a9f087d0188b643a',
            '03-parent-record-saved.png':'2f5574de8346881fbf4cdd40a6f91148d0818bd1555d3f860f7c4aa3ce3c06c2',
            '04-child-explains.png':'cb9f9683c4e494870c34c9faaa22023eea1570e25ba1f8b41fa4da17b3eea660',
            '05-child-retry-saved.png':'d0894d37ddc265cb4fad855bdc05feb1509cea771c35f352228c7f39b6ba957b',
            '06-parent-observation.png':'bb1390494d64559d93e9f68bd2b3e2093da1382ada180e12ff4c70f4d1cb1025',
            '07-parent-followup-history.png':'9790bca662ce9a17434f00858dcc7cb9012e099172b06fc6567244931475662f',
            '08-child-after-parent.png':'22edd5c2d68a95ba809d12f4552903bd1f37c9bbe42b0217cb56cbbd4c1c0764',
            '09-child-reentry.png':'6e9601650ba7e5a03a04a0027ce2d390eeb7e67b2c042e31cac0bab2be9e24d6',
            '10-parent-returns.png':'a4f12910e321fce818d664d9475c66198d92049fa69d032229630b270fdc6285',
          }
          stages=[
            ('01-parent-entry.png','01 부모가 시작 화면을 확인'),
            ('02-parent-registration.png','02 같은 가상 오답과 1픽셀 합성 사진 등록'),
            ('03-parent-record-saved.png','03 오답 ID·원본 사진 저장 후 상세 확인'),
            ('04-child-explains.png','04 아이가 답과 자기 설명 직접 작성'),
            ('05-child-retry-saved.png','05 같은 오답에 아이 재풀이 이력 저장'),
            ('06-parent-observation.png','06 부모가 아이 설명을 듣고 관찰 기록'),
            ('07-parent-followup-history.png','07 다음 확인 희망일·질문을 수동 기록'),
            ('08-child-after-parent.png','08 아이 모드 복귀·부모 전용 DOM 차단'),
            ('09-child-reentry.png','09 아이가 같은 문제 다시 열어보기'),
            ('10-parent-returns.png','10 부모 복귀 후 메모·관찰·이력 유지')
          ]
          assert set(manifest)=={p.name for p in (root/'fixed').glob('*.png')}
          assert len(manifest)==10
          assert len({x for x in manifest.values()})==10
          assert (root/'baseline').exists()
          lines=['# 우리아이 오답노트 — 수정 후 가상 화면 10장 (비배포)',
          '', '> 합성 가상자료만 사용한 **로컬 Chromium 320px 시연 캡처**입니다. 실제 인증·배포/실폰/실OCR 검증이 아니며, `safeToRestore:false`입니다. 보기 모드 전환은 가족 인증을 대신하지 않습니다.',
          '', '**열람:** 이미지 제목을 누르면 GitHub에서 해당 원본 PNG를 개별로 엽니다. 아래 그림도 클릭하면 커집니다.',
          '', '**수정 전 결함 화면(\`baseline/\`)은 이 폴더로 복사하지 않았습니다.**',
          '', '## 단계별 화면 (같은 가상 오답 ID 1건)', '']
          for name,title in stages:
            path=root/'fixed'/name
            blob=path.read_bytes()
            assert blob.startswith(bytes.fromhex('89504e470d0a1a0a')),name
            assert struct.unpack('>I',blob[8:12])[0]==13,name
            assert struct.unpack('>I',blob[16:20])[0]==320,name
            assert len(blob)>50000 and len(blob)<2000000,name
            digest=hashlib.sha256(blob).hexdigest()
            assert digest==manifest[name],(name,digest)
            shutil.copyfile(path,output/name)
            lines.extend(['### '+title,'','[원본 PNG 열기](./'+name+')','','[![가상 화면 '+title+'](./'+name+')](./'+name+')',''])
          lines.extend(['## 출처와 검증 범위','','- [학부모 단계별 설명 v1](../wrong-qa79-parent-photo-guide-v1.md)',
            '- [기존 QA79 Actions](https://github.com/jinbh99-arch/uri-wrong-answer-qa/actions/runs/43617826347) — 수정 전·후 각 11/11 가상 Chromium PASS 기록',
            '- [기존 Artifact 14121874656](https://github.com/jinbh99-arch/uri-wrong-answer-qa/actions/runs/43617826347/artifacts/14121874656) — 이곳에서 **fixed 10장만** 무수정 복사',
            '- [기존 개인정보 국소 수정 PR #67](https://github.com/jinbh99-arch/uri-wrong-answer-qa/pull/67)',
            '- 시작점·캡처에 표시된 SHA: `d8c44b165a2cb3c9b0525c00f0d0843437eff639` (수정 전 기준). 이 이미지 자체는 **dev 최종 SHA의 외부 배포 증거가 아닙니다**.',
            '- 실제 가족 인증·권한/저장소 분리·실폰·실OCR·Netlify 호스팅·06 독립 동적 시험은 **미검증**. 이 화면은 비배포 문서 자료입니다.',
            ''])
          (output/'README.md').write_text('\n'.join(lines),encoding='utf-8')
          (output/'SHA256SUMS.txt').write_text(''.join(d+'  '+n+'\n' for n,d in manifest.items()),encoding='utf-8')
          guide=pathlib.Path('docs/wrong-qa79-parent-photo-guide-v1.md')
          old=guide.read_text(encoding='utf-8')
          link='[수정 후 가상 화면 10장을 GitHub에서 개별로 보기](./qa79-fixed-320px/README.md)'
          assert link not in old
          assert old.startswith('# 우리아이 오답노트')
          old=old.replace('\n\n','\n\n> **ZIP 없이 보기:** '+link+' (정상 `fixed/` 화면만)\n\n',1)
          guide.write_text(old,encoding='utf-8')
          assert not any(p.name.startswith('baseline') for p in output.glob('*.png'))
          print('QA80 PASS: exact source sha256 10/10; png signature+320px 10/10; fixed-only 10; unique 10; guide link present')
          PY
      - name: Commit verified images and gallery to isolated QA only, remove one-off workflow
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-fixed-gallery-individual-png-20261115-0855'
          test "$(git diff --name-only)" = "docs/wrong-qa79-parent-photo-guide-v1.md"
          test "$(find docs/qa79-fixed-320px -name '*.png' | wc -l)" = 10
          test ! -e docs/qa79-fixed-320px/baseline
          git rm -- .github/workflows/wrong-qa80-once-gallery.yml
          git add -- docs/qa79-fixed-320px docs/wrong-qa79-parent-photo-guide-v1.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(wrong): publish ten preverified fixed synthetic screenshots with direct GitHub gallery'
          git push origin "HEAD:$GITHUB_REF_NAME"