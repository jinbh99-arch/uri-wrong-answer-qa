name: WRONG v1 first-use mode non-auth local-not-restorable warning, 4 synthetic viewports
on:
  push:
    branches: ['qa/wrong-v1-first-use-local-boundary-20261111']
    paths:
      - 'index.html'
      - 'tests/wrong-v1-first-use-boundary-readonly.mjs'
      - '.github/workflows/wrong-v1-first-use-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-use-warning-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Guard A, exact v1 QA baseline, one first-use note only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ff20d6caa2f23a7c610f574b86a61587d8b8b644
          git fetch --no-tags origin c7d413f311df5bc983bc63f18027ac18b0445f27
          test "$(git rev-parse c7d413f311df5bc983bc63f18027ac18b0445f27:index.html)" = "58754380d6fa764256100963d1a9da5d11873d19"
          test -z "$(git diff --name-only ff20d6caa2f23a7c610f574b86a61587d8b8b644 HEAD -- scripts db supabase)"
          git diff --numstat ff20d6caa2f23a7c610f574b86a61587d8b8b644 HEAD -- index.html | awk '$1<=2 && $2<=2 && $3=="index.html" {ok=1} END {exit !ok}'
          grep -q '이 브라우저에 저장한 사진·관찰도 안전한 복원은 보장되지 않습니다' index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sandbox Chromium and font
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Check role note and local storage non-restore warning on original first screen
        env:
          WRONG_FIRST_USE_SYNTHETIC_ONLY: '1'
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/wrong-v1-first-use-boundary-readonly.mjs
          node tests/wrong-v1-first-use-boundary-readonly.mjs | tee /tmp/wrong-first-use.log
          grep -q 'WRONG_FIRST_USE_RESULT={"status":"PASS"' /tmp/wrong-first-use.log
      - name: Archive first-use 320 390 CSS100 200 screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WRONG_V1_FIRST_USE_MODE_NOT_AUTH_LOCAL_NOT_RESTORE
          path: test-results/wrong-first-use-boundary
          if-no-files-found: warn
          retention-days: 14
