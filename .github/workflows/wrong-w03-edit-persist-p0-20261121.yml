name: WRONG W03 OCR parent-edited persistence P0 isolated
on:
  push:
    branches: ['qa/wrong-w03-edit-persist-p0-20261121']
    paths:
      - 'tests/wrong-w03-edit-persist-p0-20261121.mjs'
      - '.github/workflows/wrong-w03-edit-persist-p0-20261121.yml'
permissions:
  contents: read
jobs:
  w03-p0-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify pinned product and isolated QA only
        run: |
          set -eu
          test "$(git rev-parse HEAD:index.html)" = 250aff5b0a46490488b64f7b96a83c940d2d6c71
          test "$(git rev-parse 3eac1ec8fbf9a38b75ca317c4088dd9c759ac39b:index.html)" = 250aff5b0a46490488b64f7b96a83c940d2d6c71
          git diff --exit-code 3eac1ec8fbf9a38b75ca317c4088dd9c759ac39b HEAD -- index.html
          node --check tests/wrong-w03-edit-persist-p0-20261121.mjs
      - name: Install synthetic Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: W03 modified OCR confirm save reread and child DOM
        run: node tests/wrong-w03-edit-persist-p0-20261121.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrong-w03-edited-ocr-qa-p0
          path: qa-proof/wrong-w03-edit-persist/**/*
          if-no-files-found: warn
          retention-days: 7
