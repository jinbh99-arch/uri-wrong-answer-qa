name: WRONG QA81 new unsaved parent record edit mode-switch 320px
on:
  push:
    branches: ['qa/wrong-unsaved-parent-note-20261115-1135']
    paths:
      - 'tests/qa81-unsaved-parent-record-edit-chromium.mjs'
      - '.github/workflows/wrong-qa81-unsaved-parent-edit-once.yml'
permissions:
  contents: write
jobs:
  unsaved-record-parent-to-child:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new QA81 code syntax only
        run: node --check tests/qa81-unsaved-parent-record-edit-chromium.mjs
      - name: Install browser for only new QA81 journey
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: New 320px synthetic unsaved parent edit, child DOM and exact record/photo audit
        env:
          WRONG_QA81_DEV_SHA: 'b11ead1e05d993c82e5971be752ee8f53def5a5a'
        run: |
          node tests/qa81-unsaved-parent-record-edit-chromium.mjs
      - name: Remove one-off workflow on isolated QA only after successful browser proof
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-unsaved-parent-note-20261115-1135'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/wrong-qa81-unsaved-parent-edit-once.yml
          git diff --cached --check
          git commit -m 'chore(qa81): remove isolated one-time screenshot test workflow after pass'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload new synthetic 320px evidence, including if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa81-unsaved-parent-edit-320px-evidence
          path: qa-proof/qa81/*.png
          if-no-files-found: warn
          retention-days: 7
# Only new unsaved-edit path. Do not run QA74-79, deploy, use real children or alter Netlify.
