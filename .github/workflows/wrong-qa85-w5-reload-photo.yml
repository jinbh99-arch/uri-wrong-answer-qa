name: WRONG QA85 discarded upload hard reload byte-preservation
on:
  push:
    branches: ['qa/wrong-w5-discard-upload-reload-20261115']
    paths:
      - 'tests/qa85-w5-discard-upload-reload-chromium.mjs'
      - '.github/workflows/wrong-qa85-w5-reload-photo.yml'
permissions:
  contents: write
jobs:
  uploaded-draft-discard-hard-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New QA85 script syntax
        run: node --check tests/qa85-w5-discard-upload-reload-chromium.mjs
      - name: Isolated Chromium install
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: New W5 full reload and photograph byte-preservation path
        env:
          WRONG_QA85_DEV_SHA: '2ca615f1bff0ae4ee2d32978594eaf063ccb197e'
        run: node tests/qa85-w5-discard-upload-reload-chromium.mjs
      - name: Delete single-use QA85 workflow after all assertions PASS
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-w5-discard-upload-reload-20261115'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/wrong-qa85-w5-reload-photo.yml
          git diff --cached --check
          git commit -m 'chore(qa85): remove passing one-off W5 workflow'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Archive new real-browser synthetic PNG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa85-w5-original-photo-reload-320px
          path: qa-proof/qa85/*
          retention-days: 7
          if-no-files-found: warn
# Zero real family data, no internet deployment, no changes to product or main.
