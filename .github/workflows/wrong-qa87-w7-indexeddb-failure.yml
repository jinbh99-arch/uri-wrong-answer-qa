name: WRONG QA87 W7 local IndexedDB atomic-restore failure injection
on:
  push:
    branches: ['qa/wrong-w7-indexeddb-atomic-failure-20261115-1352']
    paths:
      - 'tests/qa87-w7-restore-atomic-failure-chromium.mjs'
      - '.github/workflows/wrong-qa87-w7-indexeddb-failure.yml'
permissions:
  contents: write
jobs:
  w7-isolated-actual-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Only new QA87 test syntax
        run: node --check tests/qa87-w7-restore-atomic-failure-chromium.mjs
      - name: Install Chromium for isolated mock DB
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise only four NEW fail-closed cases against the real app guards
        env:
          WRONG_QA87_DEV_SHA: 'f00a019c1eace0b42f2efe8cef8b8e119adfb971'
        run: node tests/qa87-w7-restore-atomic-failure-chromium.mjs
      - name: Remove one-time workflow if all assertions pass
        run: |
          test "$GITHUB_REF_NAME" = 'qa/wrong-w7-indexeddb-atomic-failure-20261115-1352'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/wrong-qa87-w7-indexeddb-failure.yml
          git diff --cached --check
          git commit -m 'chore(qa87): remove passing one-off W7 failure-injection CI'
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload only new synthetic proof PNG and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa87-w7-actual-idb-restore-failclosed
          path: qa-proof/qa87/*
          retention-days: 7
          if-no-files-found: warn
# Does not run a real backup restore, bypass safeToRestore, or access operational storage.
