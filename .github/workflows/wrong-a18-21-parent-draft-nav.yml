name: WRONG A18-21 failed parent memo draft navigation
on:
  push:
    branches: ['qa/wrong-a18-19-parent-visible-feedback-20261117-2235']
    paths:
      - 'index.html'
      - 'tests/wrong-a18-21-parent-draft-nav.mjs'
      - '.github/workflows/wrong-a18-21-parent-draft-nav.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parent-draft-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reversible inherited QA patch and static source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from qa.a18_16a_clear_live_patch import apply
          baseline=subprocess.check_output(['git','show','2a070c134511a6b402f3f3c7154c0ab610e1f55f:index.html'])
          previous=apply(baseline)
          current=Path('index.html').read_bytes()
          if previous!=current:
              from qa.a18_21_parent_draft_nav_patch import apply as apply21
              assert apply21(previous)==current
              assert apply21(current,reverse=True)==previous
              print('A1821_LOCAL_QA_MINIMAL_PATCH_FORWARD_REVERSE_BYTES_PASS')
          else:
              print('A1821_BASELINE_APP_UNPATCHED_EXPECTED_RED')
          assert apply(previous,reverse=True)==baseline
          print('A1821_INHERITED_QA_REVERSE_BYTES_PASS')
          PY
          node --check tests/wrong-a18-21-parent-draft-nav.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Parent failed-save draft retention 320 and 390
        run: node tests/wrong-a18-21-parent-draft-nav.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wrong-a18-21-failed-parent-draft-navigation
          path: qa-proof/wrong-a18-21/**/*
          if-no-files-found: warn
          retention-days: 7
