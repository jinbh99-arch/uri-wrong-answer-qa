name: WRONG QA63 parent old observation vs latest retry
on:
  push:
    branches: ['qa/wrong-dev-stage-parent-observation-20261114']
    paths:
      - 'index.html'
      - 'tests/qa63-parent-stage-separate-observation-node.mjs'
      - 'tests/qa63-parent-stage-separate-observation-chromium.mjs'
      - '.github/workflows/wrong-qa63-stage-context.yml'
permissions:
  contents: read
jobs:
  saved-parent-history-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New real-source Node stage and regression only
        run: |
          node --check tests/qa63-parent-stage-separate-observation-node.mjs
          node --check tests/qa63-parent-stage-separate-observation-chromium.mjs
          node tests/qa63-parent-stage-separate-observation-node.mjs
      - name: Browser only after new Node passes
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve isolated localhost product source
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/wrong-qa63.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Only new old-parent-plus-new-retry Chromium scenarios
        env:
          QA_SYNTHETIC_FAMILY_ONLY: '1'
        run: node tests/qa63-parent-stage-separate-observation-chromium.mjs
      - name: Exact SHA, no deployment
        run: |
          echo "WRONG_QA63_SHA=$(git rev-parse HEAD)"
          echo "WRONG_QA63_DEPLOYMENT=false"
# No old suites, operational auth/DB, real child data, or release.
